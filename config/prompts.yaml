# config/prompts.yaml — the 58-prompt corpus (PLAN §II.2.1; PREREG §3). Split frozen by id.
# Briefs describe DOMAIN + FUNCTION only. The constant output constraint (skill.yaml) is
# appended to every brief at assembly time (not stored in the text here).
#
# banned_words: whole-word, case-insensitive; matched over the USER-turn brief text ONLY
# (output constraint + system cell texts excluded). Zero matches required (PLAN §II.2).
banned_words:
  - beautiful
  - modern
  - clean
  - sleek
  - elegant
  - minimalist
  - aesthetic
  - stylish
  - polished
  - premium
  - vibrant
  - colorful
  - gradient
  - purple
  - gorgeous
  - stunning
  - slick
  - professional-looking
  - cutting-edge
  - design
  - designer
  - designed
  - redesign

split_freeze:
  dev: [L01,L02,L03,L04,L05, D01,D02,D03,D04,D05, F01,F02,F03,F04,F05, P01,P02,P03,P04,P05,
        PF01,PF02,PF03,PF04,PF05, B01,B02,B03,B04,B05, E01,E02,E03,E04,E05, A01,A02,A03,A04,A05]
  heldout_seen: [L06, D06, F06, P06, PF06, B06, E06, A06]
  heldout_unseen: [ST01,ST02,ST03,ST04,ST05, AT01,AT02,AT03,AT04,AT05]

