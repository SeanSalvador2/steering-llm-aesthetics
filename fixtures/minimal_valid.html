<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal valid page</title>
<style>
  body { margin: 0; font-family: Georgia, serif; color: #1a1a1a; background: #ffffff; line-height: 1.5; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 30px; margin: 0 0 16px; }
  p { font-size: 17px; margin: 0 0 14px; color: #2b2b2b; }
  a { color: #1a4d8f; }
</style>
</head>
<body>
  <main>
    <h1>A quiet, valid page</h1>
    <p>This fixture is intentionally minimal: one heading, two paragraphs, and a link, all with
       comfortable contrast and a single system serif face.</p>
    <p>It renders hermetically with no external requests. See the <a href="#top">top</a> of the page.</p>
  </main>
</body>
</html>
